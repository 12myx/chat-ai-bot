<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AI Chat</title>
</head>

<body>

    <h1>我的AI助手</h1>

    <input type="text" id="userInput">

    <button onclick="sendMessage()">
        发送
    </button>

    <div id="chat"></div>

    <script>
        function sendMessage() {
            const input = document.getElementById("userInput")

            const message = input.value

            document.getElementById("chat").innerHTML +=
                "<p>你：" + message + "</p>"
        }
    </script>

</body>

</html>
