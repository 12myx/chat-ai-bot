<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AI Chat</title>
    <style>

body {
    margin: 0;
    font-family: Arial;
    background-color: #e3e6e6;
}

/* 整体布局 */
.container {
    display: flex;
    height: 100vh;
}

/* 左侧栏 */
.sidebar {
    width: 260px;
    background-color: #202123;
    color: white;
    padding: 20px;
}

/* 新聊天按钮 */
.sidebar button {
    width: 100%;
    padding: 12px;
    border: none;
    background-color: #343541;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* 右侧聊天区域 */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
}

/* 聊天框 */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* 输入区域 */
.input-area {
    display: flex;
    gap: 10px;
}

/* 输入框 */
input {
    flex: 1;
    padding: 14px;

    font-size: 16px;

    border: 1px solid #ccc;

    border-radius: 10px;

    outline: none;
}

/* 按钮 */
.input-area {
    display: flex;
    gap: 10px;

    padding: 20px;

    background-color: #f0f2f5;

    border-top: 1px solid #ccc;
}

/* 消息 */
.message {
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    width: fit-content;
    max-width: 70%;
}

/* 用户 */
.user {
    background-color: #95ec69;
    margin-left: auto;
}

/* AI */
.ai {
    background-color: white;
}
/* 按钮 */
button {
    padding: 12px 18px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    background-color: #19c37d;

    color: white;

    font-size: 15px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>

<div class="container">

    <!-- 左侧栏 -->
    <div class="sidebar">

        <button onclick="newChat()">
            + 新聊天
        </button>

        <div id="chatList"></div>

    </div>

    <!-- 右侧区域 -->
    <div class="main">
        <!-- 标题 -->
        <h1>陈文坚的AI助手</h1>
        <!-- 聊天区域 -->
        <div id="chat"></div>
        <!-- 输入区域 -->
        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="输入消息..."
                onkeydown="handleKey(event)"
            >

            <button onclick="sendMessage()">
                发送
            </button>

            <button onclick="clearChat()">
                清空
            </button>

        </div>
    </div>
</div>

<script>

// 滚动到底部的辅助函数
function scrollToBottom() {
    const chatBox = document.getElementById("chat");
    chatBox.scrollTop = chatBox.scrollHeight;
}

//定义发送消息的函数
async function sendMessage() {

    // 获取用户输入
    const input = document.getElementById("userInput")
    const message = input.value
    
    if (!message.trim()) {
        return; // 如果消息为空，不发送
    }

    // 显示用户消息，并添加到聊天框中
    document.getElementById("chat").innerHTML +=
        `
<div class="message user">
    你：${message}
</div>
`
    // 立即滚动到底部
    scrollToBottom();

    try {
        // 发送请求给后端，并等待AI回复
        const response = await fetch("/chat", {
            method: "POST",
    // 设置请求头，指定内容类型为JSON
            headers: {
                "Content-Type": "application/json"
            },

    // 请求体包含用户消息
            body: JSON.stringify({
                message: message
            })
        })

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        // 获取AI回复
        const reader = response.body.getReader()

        const decoder = new TextDecoder()

        let aiMessage = ""
        // 创建一个新的div元素来显示AI消息
        const aiDiv = document.createElement("div")

        aiDiv.className = "message ai"

        document.getElementById("chat").appendChild(aiDiv)

        while (true) {
        // 读取流数据
            const { done, value } = await reader.read()

        // 如果读取完成，退出循环
            if (done) {
                break
            }

            const text = decoder.decode(value)
            if (text === "null") {
            continue
            }

            aiMessage += text

        aiDiv.innerHTML =
            "AI：<br>" + marked.parse(aiMessage)

        hljs.highlightAll()
        
        // 实时滚动到底部
        scrollToBottom();
        }
        // 清空输入框
        input.value = ""
    } catch (error) {
        console.error("发送消息时出错:", error);
        document.getElementById("chat").innerHTML += 
            `<div class="message ai">AI：抱歉，发生错误：${error.message}</div>`;
        scrollToBottom();
    }
}

//定义键盘事件处理函数
function handleKey(event) {

    if (event.key === "Enter") {

        //调用发送消息的函数
        sendMessage()
        // 不需要在这里设置滚动，因为sendMessage中已经处理了
    }
}
//定义清空聊天记录的函数
function clearChat() {
    fetch("/clear", {
        method: "POST"
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("chat").innerHTML = "";
    })
    .catch(error => {
        console.error("清空聊天记录时出错:", error);
    });
}
//定义新聊天的函数
async function newChat() {

    try {
        const response = await fetch("/new_chat", {
            method: "POST"
        })

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json()

        const div = document.createElement("div")

        div.innerHTML = data.chat_id
        div.onclick = () => switchChat(data.chat_id)

        document.getElementById("chatList").appendChild(div)

        document.getElementById("chat").innerHTML = ""
    } catch (error) {
        console.error("创建新聊天时出错:", error);
    }
}
// 定义切换聊天的函数
async function switchChat(chatId) {

    const response = await fetch("/switch_chat", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            chat_id: chatId
        })
    })

    const data = await response.json()

    const chatBox = document.getElementById("chat")

    chatBox.innerHTML = ""

    data.messages.forEach(msg => {

        if (msg.role === "system") {
            return
        }

        const div = document.createElement("div")

        div.className =
            msg.role === "user"
            ? "message user"
            : "message ai"

        div.innerHTML =
            msg.role === "user"
            ? `你：${msg.content}`
            : "AI：<br>" + marked.parse(msg.content)

        chatBox.appendChild(div)
    })

    hljs.highlightAll()

    scrollToBottom()
}

</script>

</body>

</html>
